# 세 서버를 한 번에 띄운다 — 팀원 컴마다 Java · Node · Python 버전이 달라 "내 컴에선 되는데" 가 나는 걸 막으려고.
# 기준 버전은 각 Dockerfile 의 이미지 태그이고, 사용법은 docs/dev-environment.md 다.
#
#   docker compose up --build                                    Supabase 를 쓰는 사람(.env 에 접속 정보)
#   docker compose -f compose.yaml -f compose.localdb.yaml up --build   DB 까지 로컬 컨테이너로(.env 없어도 뜬다)
#
# 포트는 로컬 개발과 같다(web 5173 · api 8080 · ai 8000). npm run dev 나 bootRun 을 띄워 둔 채로 올리면 충돌한다 —
# 그럴 땐 WEB_PORT=15173 API_PORT=18080 docker compose up 처럼 호스트 포트만 바꾼다.
# 브라우저는 web 포트로 들어간다. /api 는 nginx 가 api 로 넘기므로 api 포트를 직접 열 일은 curl 뿐이다.

services:
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    # api 가 실제로 요청을 받을 때(healthcheck 통과)까지 web 을 띄우지 않는다.
    # 컨테이너가 "떴다"와 Spring 이 "듣는다"는 다르다 — 그 사이에 브라우저를 열면 nginx 가 502 를 준다.
    # api 가 죽으면(예: .env 도 로컬 DB 오버레이도 없음) compose 가 "dependency failed to start" 로 멈춘다 — 502 로 숨지 않는다.
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    # Supabase · Slack 값. 없으면 SUPABASE_DB_URL 자리표시자를 못 풀어 바로 죽는다 — 그게 맞다.
    # 로컬 DB 오버레이(compose.localdb.yaml)를 쓰면 DB 값은 거기서 오므로 .env 가 없어도 된다.
    env_file:
      - path: .env
        required: false
    environment:
      # application.yml 의 ../.env 강제 import 를 끈다 — 값은 위 env_file 로 받는다.
      SPRING_PROFILES_ACTIVE: docker
      # 워커가 부르는 AI 서버. localhost 가 아니라 compose 네트워크의 서비스 이름이다.
      AI_SERVER_BASE_URL: http://ai:8000
    ports:
      - "${API_PORT:-8080}:8080"
    # /api/auth/me 는 로그아웃 상태에서도 200(null)이다 — Spring 이 진짜 듣고 있는지 보는 가장 싼 요청.
    # start_period 는 느린 컴에서 Spring 이 뜨는 시간 여유(여기서는 3초, 첫 실행 Flyway 까지 넉넉히).
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/api/auth/me"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 90s
    depends_on:
      - ai

  ai:
    build: ./ai
    # /ai/* 는 지금 Mock 이라 키가 없어도 뜬다. AI_INTERNAL_TOKEN 을 두면 Spring 쪽 AI_INTERNAL_TOKEN 과 같아야 한다.
    env_file:
      - path: ai/.env
        required: false
    ports:
      # 프론트도 브라우저도 직접 부르지 않는다. 호스트에서 curl 로 확인할 때만 쓰라고 127.0.0.1 에만 연다.
      - "127.0.0.1:8000:8000"
