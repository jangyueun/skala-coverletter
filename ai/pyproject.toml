[project]
name = "careerfit-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3.0",
    "anthropic>=1.0,<2.0",
    "fastapi>=0.116,<1.0",
    "python-dotenv>=1.1,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
