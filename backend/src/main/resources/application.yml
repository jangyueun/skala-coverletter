# ⚠ Spring Initializr 로 프로젝트를 만들면 application.properties 가 생긴다.
#    둘 다 두면 헷갈리니 properties 는 지우고 이 파일을 쓴다.

spring:
  application:
    name: careerfit
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      # 공용 DB 스키마는 Flyway만 변경하고 Hibernate는 엔티티와의 일치만 검증한다.
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # 실제 "10MB 초과" 판정(FILE_TOO_LARGE)은 서비스가 파일당 기준으로 한다. 여기는 그보다
      # 넉넉하게 잡아 Spring이 먼저 잘라내지 않게만 한다(최대 5개 × 10MB + 여유분).
      max-file-size: 15MB
      max-request-size: 80MB

  # 로그인 세션 쿠키. HttpOnly 는 JS 가 못 읽게 하는 것이고,
  # SameSite=Lax 여야 Slack 콜백(외부 도메인 → 우리 서버)에 쿠키가 실린다.
  # Strict 로 두면 콜백에서 state 대조가 항상 실패한다.
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
      timeout: 14d

careerfit:
  ai:
    # 로컬은 ai/ 폴더의 FastAPI 서버(uvicorn app.main:app --port 8000). 배포 주소는 환경변수로.
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # Python 쪽 AI_INTERNAL_TOKEN과 같은 값. 비어 있으면 로컬 개발용 — Authorization 헤더를 안 붙인다.
    internal-token: ${AI_INTERNAL_TOKEN:}
  storage:
    # DB 접속용 SUPABASE_DB_URL(풀러 JDBC 주소)과는 다르다 — 프로젝트 REST URL이다. 예: https://xxxx.supabase.co
    url: ${SUPABASE_URL:}
    # anon 키가 아니다. RLS를 우회해 서버가 대신 올려야 해서 서비스 롤 키가 필요하다.
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:intake}
  internal:
    # 공고 수집기 등 신뢰할 수 있는 서버만 /internal/* 호출에 사용한다.
    # 실제 토큰은 .env 또는 배포 환경변수에만 둔다.
    token: ${INTERNAL_API_TOKEN:}
  auth:
    # 실제 값은 절대 여기 쓰지 않는다. .env 또는 배포 환경변수로 준다.
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    # 우리 워크스페이스. 이 값과 다른 워크스페이스 계정은 403 으로 막힌다.
    allowed-team-id: ${SLACK_ALLOWED_TEAM_ID:T089ENT4A2D}
    # 요청 헤더에서 유추하지 않고 이 값을 그대로 쓴다.
    # Slack App 설정의 Redirect URL 과 문자 하나까지 같아야 한다.
    redirect-uri: ${SLACK_REDIRECT_URI:}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    session-ttl: 14d

---
# test 외의 실행은 backend/ 기준 ../.env가 반드시 필요하다.
# 파일이 없으면 Spring이 즉시 경로와 원인을 표시하고 종료한다.
spring:
  config:
    activate:
      on-profile: "!test"
    import: file:../.env[.properties]
