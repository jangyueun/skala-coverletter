# 웹 컨테이너의 nginx. 정적 파일을 주고 /api 만 API 컨테이너로 넘긴다.
# dev 의 vite.config.js proxy 와 같은 역할이다 — 화면과 API 가 같은 오리진이어야 세션 쿠키가 그냥 붙는다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 계열만 압축. 이미지·폰트는 이미 압축돼 있어 CPU 만 쓴다.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # compose 서비스 이름. 끝에 경로를 안 붙여야 /api/... 가 그대로 전달된다.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Slack 로그인 302 · 세션 쿠키 · Sec-Fetch-Site(CSRF 가드)는 헤더 그대로 지나간다 — 손대지 않는다.
        # 인테이크 첨부: 파일당 10MB × 5 + 여유. Spring 의 max-request-size(80MB)와 맞춘다.
        client_max_body_size 80m;
        # AI 작업 폴링이 아니라 요청 자체가 오래 걸리는 곳은 없다. 기본 60초면 된다.
    }

    # Vite 가 파일명에 해시를 박으므로 오래 캐시해도 안전하다. 새 빌드는 새 이름이다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — /postings/9 같은 깊은 주소로 새로고침해도 index.html 을 준다. 라우팅은 Vue Router 가 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
